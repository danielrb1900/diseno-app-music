<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Pantalla de reproducción de Music.">
    <title>Music · Reproductor</title>
    <link rel="icon" href="img/logo-app.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="scss/style.css">
</head>

<body class="pagina-reproductor">
    <a class="saltar-contenido" href="#contenido">Saltar al contenido principal</a>

    <main class="reproductor-pagina" id="contenido">
        <div class="reproductor-pagina__barra">
            <a class="reproductor-pagina__icono reproductor-pagina__cerrar" href="index.html"
                aria-label="Cerrar el reproductor">
                <img src="img/flecha-arriba.png" alt="Cerrar el reproductor" width="20" height="12">
            </a>

            <p class="reproductor-pagina__contexto">Reproduciendo<span class="reproductor-pagina__origen"> desde: Lista 1</span></p>

            <button class="reproductor-pagina__icono" type="button" aria-label="Más opciones">
                <img src="img/tres.puntos.png" width="20" height="6">
            </button>
        </div>

        <section class="reproductor-pagina__contenido" aria-labelledby="titulo-reproductor">
            <img class="reproductor-pagina__portada" src="img/dtmf-album.png" alt="Portada de Veldá"
                width="440" height="440">

            <div class="reproductor-pagina__meta">
                <div>
                    <h1 class="reproductor-pagina__titulo" id="titulo-reproductor">Veldá</h1>
                    <p class="reproductor-pagina__artista">Bad Bunny</p>
                </div>
                <button class="reproductor-pagina__me-gusta" type="button" aria-label="Me gusta">
                    <img src="img/corazon.png" width="20" height="18">
                </button>
            </div>

            <div class="reproductor-pagina__progreso">
                <label class="visually-hidden" for="progreso-reproductor">Progreso de la canción</label>
                <input class="barra-progreso" id="progreso-reproductor" type="range"
                    min="0" max="225" value="84">
                <div class="reproductor-pagina__tiempos">
                    <span>1:24</span>
                    <span>3:45</span>
                </div>
            </div>

            <div class="reproductor-pagina__controles">
                <button class="reproductor-pagina__control" type="button" aria-label="Activar modo aleatorio">
                    <img src="img/aleatorio.png" width="24" height="24">
                </button>
                <button class="reproductor-pagina__control" type="button" aria-label="Canción anterior">
                    <img src="img/cancion-anterior.png" width="24" height="24">
                </button>
                <button class="reproductor-pagina__control reproductor-pagina__control--play" type="button"
                    aria-label="Reproducir">
                    <img src="img/play.png" width="56" height="56">
                </button>
                <button class="reproductor-pagina__control" type="button" aria-label="Siguiente canción">
                    <img src="img/siguiente-cancion.png" width="24" height="24">
                </button>
                <button class="reproductor-pagina__control reproductor-pagina__control--ajustes" type="button"
                    aria-label="Ajustes del reproductor">
                    <img src="img/ajustes.png" width="24" height="24">
                </button>
            </div>
        </section>

        <div class="reproductor-pagina__acciones">
            <button class="reproductor-pagina__accion" type="button">
                <img src="img/cola.png" alt="Cola" width="20" height="20">
                <span>Cola</span>
            </button>
            <button class="reproductor-pagina__accion" type="button">
                <img src="img/letra.png" alt="Letra" width="20" height="20">
                <span>Letra</span>
            </button>
            <button class="reproductor-pagina__accion" type="button">
                <img src="img/tres.puntos.png" alt="Opciones" width="20" height="6">
                <span>Opciones</span>
            </button>
        </div>
    </main>
</body>

</html>
