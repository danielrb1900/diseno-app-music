<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Busca canciones, artistas y álbumes, o explora nuevos géneros en Music.">
    <title>Music · Buscar</title>
    <link rel="icon" href="img/logo-app.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-buscar">
    <a class="saltar-contenido" href="#contenido">Saltar al contenido principal</a>

    <header class="cabecera">
        <a class="marca" href="index.html" aria-label="Music, ir al inicio">
            <img class="marca__logo" src="img/logo-app.png" alt="Logotipo de Music" width="36" height="36">
            <span class="marca__texto">
                <span class="marca__titulo">Music</span>
                <span class="marca__subtitulo">Navegación</span>
            </span>
        </a>

        <div class="cabecera__acciones">
            <a class="btn btn-secundario" href="inicio-sesion.html">Iniciar sesión</a>
            <a class="btn btn-primary" href="registro.html">Registrarse</a>
        </div>

        <a class="avatar-movil" href="perfil.html" aria-label="Ir a mi perfil">
            <img src="img/perfil-activado.png"  alt="Mi perfil" width="20" height="20">
        </a>
    </header>

    <aside class="menu-lateral">
        <nav aria-label="Navegación principal">
            <ul class="menu-lateral__lista">
                <li>
                    <a class="menu-lateral__enlace" href="index.html">
                        <img src="img/inicio-desactivado.png" alt="Icono de inicio" width="24" height="24">
                        Inicio
                    </a>
                </li>
                <li>
                    <a class="menu-lateral__enlace activo" href="buscar.html" aria-current="page">
                        <img src="img/buscar-activado.png" alt="Icono de buscar" width="24" height="24">
                        Buscar
                    </a>
                </li>
                <li>
                    <a class="menu-lateral__enlace" href="biblioteca.html">
                        <img src="img/biblioteca-desactivado.png" alt="Icono de biblioteca" width="24" height="24">
                        Biblioteca
                    </a>
                </li>
                <li>
                    <a class="menu-lateral__enlace" href="perfil.html">
                        <img src="img/perfil-desactivado.png" alt="Icono de perfil" width="24" height="24">
                        Perfil
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="contenido" id="contenido">
        <div class="container-fluid px-0">
            <section aria-labelledby="titulo-buscar">
                <h1 class="titulo-pagina" id="titulo-buscar">Buscar</h1>

                <form class="buscador-pagina" role="search" action="#" method="get">
                    <div class="buscador-pagina__campo">
                        <img class="icono" src="img/lupa-buscar.png" alt="Icono de búsqueda" width="24" height="24">
                        <label class="visually-hidden" for="buscador-principal">Buscar canciones, artistas o
                            álbumes</label>
                        <input class="form-control" id="buscador-principal" name="q" type="search"
                            placeholder="¿Qué quieres escuchar?">
                    </div>
                    <button class="btn btn-filtros" type="button" aria-label="Abrir filtros de búsqueda">
                        <img class="icono--blanco" src="img/ajustes.png"  alt="Ajustes" width="24" height="24">
                    </button>
                </form>
            </section>

            <section class="seccion-generos" aria-labelledby="titulo-generos">
                <h2 id="titulo-generos">Explorar por género</h2>

                <div class="row g-4">
                    <article class="col-6 col-md-3">
                        <a class="genero genero--primario" href="biblioteca.html">
                            <h3>Pop</h3>
                        </a>
                    </article>
                    <article class="col-6 col-md-3">
                        <a class="genero genero--secundario" href="biblioteca.html">
                            <h3>Rock</h3>
                        </a>
                    </article>
                    <article class="col-6 col-md-3">
                        <a class="genero genero--oscuro" href="biblioteca.html">
                            <h3>Hip Hop</h3>
                        </a>
                    </article>
                    <article class="col-6 col-md-3">
                        <a class="genero genero--claro" href="biblioteca.html">
                            <h3>Electrónica</h3>
                        </a>
                    </article>
                    <article class="col-6 col-md-3">
                        <a class="genero genero--secundario" href="biblioteca.html">
                            <h3>Jazz</h3>
                        </a>
                    </article>
                    <article class="col-6 col-md-3">
                        <a class="genero genero--primario" href="biblioteca.html">
                            <h3>Latina</h3>
                        </a>
                    </article>
                    <article class="col-6 col-md-3">
                        <a class="genero genero--claro" href="biblioteca.html">
                            <h3>Clásica</h3>
                        </a>
                    </article>
                    <article class="col-6 col-md-3">
                        <a class="genero genero--oscuro" href="biblioteca.html">
                            <h3>Indie</h3>
                        </a>
                    </article>
                </div>
            </section>
        </div>
    </main>

    <footer class="reproductor">
        <h2 class="visually-hidden">Reproductor de audio</h2>

        <div class="reproductor__pista">
            <img class="reproductor__portada" src="img/dtmf-album.png" alt="Portada de Veldá" width="64"
                height="64">
            <div class="reproductor__info">
                <p class="reproductor__titulo">Veldá</p>
                <p class="reproductor__artista">Bad Bunny</p>
            </div>
        </div>

        <div class="reproductor__controles">
            <button class="reproductor__control reproductor__control--opcional" type="button" aria-label="Activar modo aleatorio">
                <img src="img/aleatorio.png"  alt="Activar modo aleatorio" width="24" height="24">
            </button>
            <button class="reproductor__control reproductor__control--opcional" type="button" aria-label="Me gusta">
                <img src="img/corazon.png" alt="Me gusta" width="24" height="24">
            </button>
            <button class="reproductor__control reproductor__control--opcional" type="button" aria-label="Añadir a una lista">
                <img src="img/mas.png" alt="Añadir a una lista" width="24" height="24">
            </button>
            <button class="reproductor__control" type="button" aria-label="Canción anterior">
                <img src="img/cancion-anterior.png"  alt="Canción anterior" width="24" height="24">
            </button>
            <button class="reproductor__control reproductor__control--play" type="button" aria-label="Reproducir">
                <img src="img/play.png"  alt="Reproducir" width="36" height="36">
            </button>
            <button class="reproductor__control" type="button" aria-label="Siguiente canción">
                <img src="img/siguiente-cancion.png" alt="Siguiente canción" width="24" height="24">
            </button>
        </div>

        <div class="reproductor__progreso">
            <span class="reproductor__tiempo">02:14</span>
            <label class="visually-hidden" for="progreso-buscar">Progreso de la canción</label>
            <input class="barra-progreso" id="progreso-buscar" type="range" min="0" max="234" value="134">
            <span class="reproductor__tiempo">03:54</span>
        </div>
    </footer>
</body>

</html>
